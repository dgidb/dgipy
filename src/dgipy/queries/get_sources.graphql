query getSources(
  $first: Int = 1000
  $sourceType: SourceTypeFilter
  $after: String
) {
  sources(first: $first, sourceType: $sourceType, after: $after) {
    nodes {
      fullName
      sourceDbName
      sourceDbVersion
      drugClaimsCount
      geneClaimsCount
      interactionClaimsCount
      license
      licenseLink
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
