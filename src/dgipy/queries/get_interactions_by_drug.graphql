query getInteractionsByDrug(
  $first: Int = 1000
  $names: [String!]
  $immunotherapy: Boolean
  $antineoplastic: Boolean
  $sourceDbName: String
  $pmid: Int
  $interactionType: String
  $approved: Boolean
  $after: String
) {
  drugs(
    first: $first
    names: $names
    immunotherapy: $immunotherapy
    antiNeoplastic: $antineoplastic
    sourceDbName: $sourceDbName
    pmid: $pmid
    interactionType: $interactionType
    approved: $approved
    after: $after
  ) {
    nodes {
      interactions {
        interactionAttributes {
          name
          value
        }
        drug {
          name
          conceptId
          approved
        }
        gene {
          name
          longName
          conceptId

          geneCategories {
            name
          }
        }
        interactionScore
        interactionClaims {
          publications {
            citation
            pmid
          }
          source {
            sourceDbName
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
