query getInteractionsByGene(
  $first: Int = 1000
  $names: [String!]
  $sourceDbName: String
  $pmid: Int
  $interactionType: String
  $after: String
) {
  genes(
    first: $first
    names: $names
    sourceDbName: $sourceDbName
    pmid: $pmid
    interactionType: $interactionType
    after: $after
  ) {
    nodes {
      interactions {
        interactionAttributes {
          name
          value
        }
        drug {
          name
          conceptId
          approved
          immunotherapy
          antiNeoplastic
        }
        gene {
          name
          longName
          conceptId
          geneCategories {
            name
          }
        }
        interactionScore
        interactionTypes {
          type
        }
        interactionClaims {
          publications {
            citation
            pmid
          }
          source {
            sourceDbName
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
