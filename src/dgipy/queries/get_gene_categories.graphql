query getGeneCategories($first: Int = 1000, $names: [String!], $after: String) {
  genes(first: $first, names: $names, after: $after) {
    nodes {
      name
      conceptId
      longName
      geneCategoriesWithSources {
        name
        sourceNames
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
