query getGenes($first: Int = 1000, $names: [String!], $after: String) {
  genes(first: $first, names: $names, after: $after) {
    nodes {
      name
      longName
      conceptId
      geneAliases {
        alias
      }
      geneAttributes {
        name
        value
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
